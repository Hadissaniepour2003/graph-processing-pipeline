name: Verify graph calculations and browser workflows
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install tested dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Test algorithms and API
        timeout-minutes: 5
        run: python scripts/verify_ci.py unit
      - name: Test real browser workflows
        run: python scripts/verify_ci.py browser
      - name: Run the original coursework pipeline
        env:
          MPLBACKEND: Agg
          PYTHONIOENCODING: utf-8
        run: python main.py
